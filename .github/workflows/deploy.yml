name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_KAKAO_JS_KEY: ${{ vars.KAKAO_JS_KEY }}
          VITE_ROUTE_PROXY_URL: ${{ vars.ROUTE_PROXY_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed HTML and assets
        shell: bash
        run: |
          set -euo pipefail
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "Checking deployed site: $URL"
          for attempt in 1 2 3 4 5; do
            if curl -fLsS --max-time 15 "$URL?verify=${GITHUB_SHA}" -o /tmp/page.html; then
              if grep -q "/assets/" /tmp/page.html; then
                echo "PASS: built asset paths appear in deployed HTML"
                head -c 700 /tmp/page.html
                echo
                exit 0
              else
                echo "WARNING: HTML does not reference built assets"
                head -c 700 /tmp/page.html
                echo
              fi
            else
              echo "Fetch failed, attempt $attempt"
            fi
            sleep 5
          done
          echo "::error::Pages is not serving Vite-built HTML; verify Pages Source is GitHub Actions."
          exit 1
      - name: Browser smoke test for React rendering
        shell: bash
        run: |
          set -euo pipefail
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/?browser=${GITHUB_SHA}"
          if command -v google-chrome >/dev/null 2>&1; then
            CHROME=google-chrome
          elif command -v chromium >/dev/null 2>&1; then
            CHROME=chromium
          else
            echo "::warning::No Chromium/Chrome executable available; skipping browser test"
            exit 0
          fi
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 --dump-dom "$URL" >/tmp/rendered.html 2>/tmp/chrome.log || true
          if grep -q "골프존파크 용두포스빌점" /tmp/rendered.html; then
            echo "PASS: React rendered itinerary in headless browser"
          else
            echo "::error::React did not render its itinerary in headless browser"
            echo "Headless browser log:"
            tail -n 35 /tmp/chrome.log || true
            echo "DOM preview:"
            head -c 1100 /tmp/rendered.html || true
            exit 1
          fi
